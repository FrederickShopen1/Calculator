<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131c;
      color: #f4f6ff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(92vw, 820px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: 0.12em;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 12px;
      font-size: 1.25rem;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #596179;
      border-radius: 8px;
      background: #080a10;
      cursor: none;
      touch-action: none;
    }

    p {
      color: #b7bfd3;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>PONG</h1>
    <div class="scoreboard" aria-live="polite">
      <span>You: <strong id="player-score">0</strong></span>
      <span>Computer: <strong id="computer-score">0</strong></span>
    </div>
    <canvas id="game" width="800" height="500" aria-label="Pong game"></canvas>
    <p>Move your mouse over the game or use the ↑ and ↓ arrow keys.</p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const playerScoreDisplay = document.getElementById("player-score");
    const computerScoreDisplay = document.getElementById("computer-score");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 90;
    const PADDLE_MARGIN = 24;
    const PLAYER_SPEED = 420;
    const COMPUTER_SPEED = 310;

    const player = {
      x: PADDLE_MARGIN,
      y: (HEIGHT - PADDLE_HEIGHT) / 2,
      score: 0
    };

    const computer = {
      x: WIDTH - PADDLE_MARGIN - PADDLE_WIDTH,
      y: (HEIGHT - PADDLE_HEIGHT) / 2,
      score: 0
    };

    const ball = {
      x: WIDTH / 2,
      y: HEIGHT / 2,
      radius: 9,
      vx: 300,
      vy: 150,
      speed: 340
    };

    const keys = { up: false, down: false };
    let lastTime = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resetBall(direction) {
      ball.x = WIDTH / 2;
      ball.y = HEIGHT / 2;
      ball.speed = 340;
      ball.vx = ball.speed * direction;
      ball.vy = Math.random() * 180 - 90;
    }

    function movePlayerTo(clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = HEIGHT / rect.height;
      player.y = clamp(
        (clientY - rect.top) * scaleY - PADDLE_HEIGHT / 2,
        0,
        HEIGHT - PADDLE_HEIGHT
      );
    }

    canvas.addEventListener("pointermove", (event) => {
      movePlayerTo(event.clientY);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        if (event.key === "ArrowUp") keys.up = true;
        if (event.key === "ArrowDown") keys.down = true;
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") keys.up = false;
      if (event.key === "ArrowDown") keys.down = false;
    });

    function update(delta) {
      if (keys.up) player.y -= PLAYER_SPEED * delta;
      if (keys.down) player.y += PLAYER_SPEED * delta;
      player.y = clamp(player.y, 0, HEIGHT - PADDLE_HEIGHT);

      // The computer tracks the ball, but has a speed limit.
      const computerCenter = computer.y + PADDLE_HEIGHT / 2;
      const difference = ball.y - computerCenter;
      computer.y += clamp(difference, -COMPUTER_SPEED * delta, COMPUTER_SPEED * delta);
      computer.y = clamp(computer.y, 0, HEIGHT - PADDLE_HEIGHT);

      ball.x += ball.vx * delta;
      ball.y += ball.vy * delta;

      // Top and bottom wall collisions.
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy = Math.abs(ball.vy);
      } else if (ball.y + ball.radius >= HEIGHT) {
        ball.y = HEIGHT - ball.radius;
        ball.vy = -Math.abs(ball.vy);
      }

      // Paddle collisions, only when the ball is moving toward that paddle.
      if (
        ball.vx < 0 &&
        ball.x - ball.radius <= player.x + PADDLE_WIDTH &&
        ball.x + ball.radius >= player.x &&
        ball.y + ball.radius >= player.y &&
        ball.y - ball.radius <= player.y + PADDLE_HEIGHT
      ) {
        bounceFromPaddle(player);
      }

      if (
        ball.vx > 0 &&
        ball.x + ball.radius >= computer.x &&
        ball.x - ball.radius <= computer.x + PADDLE_WIDTH &&
        ball.y + ball.radius >= computer.y &&
        ball.y - ball.radius <= computer.y + PADDLE_HEIGHT
      ) {
        bounceFromPaddle(computer);
      }

      // A point is scored when the ball passes either paddle.
      if (ball.x + ball.radius < 0) {
        computer.score++;
        computerScoreDisplay.textContent = computer.score;
        resetBall(1);
      } else if (ball.x - ball.radius > WIDTH) {
        player.score++;
        playerScoreDisplay.textContent = player.score;
        resetBall(-1);
      }
    }

    function bounceFromPaddle(paddle) {
      const paddleCenter = paddle.y + PADDLE_HEIGHT / 2;
      const hitPosition = (ball.y - paddleCenter) / (PADDLE_HEIGHT / 2);
      const direction = ball.vx < 0 ? 1 : -1;

      ball.speed = Math.min(ball.speed + 18, 620);
      ball.vx = direction * ball.speed;
      ball.vy = hitPosition * ball.speed * 0.75;

      // Keep the ball just outside the paddle to prevent repeated collisions.
      ball.x = direction > 0
        ? paddle.x + PADDLE_WIDTH + ball.radius
        : paddle.x - ball.radius;
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Dashed center line.
      ctx.strokeStyle = "#34394a";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 0);
      ctx.lineTo(WIDTH / 2, HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles and ball.
      ctx.fillStyle = "#f4f6ff";
      ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
      ctx.fillRect(computer.x, computer.y, PADDLE_WIDTH, PADDLE_HEIGHT);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function frame(timestamp) {
      const delta = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.03) : 0;
      lastTime = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(frame);
    }

    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
