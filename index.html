<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(340px, 92vw);
      padding: 18px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(40, 50, 70, 0.16);
    }

    #display {
      width: 100%;
      height: 76px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #f3f5f8;
      color: #1f2937;
      text-align: right;
      font-size: 2.2rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: 0;
      border-radius: 10px;
      background: #edf0f5;
      color: #1f2937;
      font-size: 1.15rem;
      cursor: pointer;
    }

    button:hover { background: #dde3ec; }
    button:active { transform: scale(0.97); }

    .operator {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .equals {
      grid-row: span 2;
      height: 126px;
      background: #2563eb;
      color: #ffffff;
    }

    .equals:hover { background: #1d4ed8; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <input id="display" type="text" value="0" readonly aria-label="Calculator display">

    <div class="buttons">
      <button class="operator" data-action="clear">C</button>
      <button class="operator" data-action="backspace">⌫</button>
      <button class="operator" data-action="operator">÷</button>
      <button class="operator" data-action="operator">×</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-action="operator">−</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-action="operator">+</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-number="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");
    let firstNumber = null;
    let operator = null;
    let waitingForNumber = false;

    function updateDisplay(value) {
      display.value = value;
    }

    function inputNumber(number) {
      if (waitingForNumber) {
        updateDisplay(number);
        waitingForNumber = false;
      } else {
        updateDisplay(display.value === "0" ? number : display.value + number);
      }
    }

    function inputDecimal() {
      if (waitingForNumber) {
        updateDisplay("0.");
        waitingForNumber = false;
      } else if (!display.value.includes(".")) {
        updateDisplay(display.value + ".");
      }
    }

    function chooseOperator(nextOperator) {
      const inputValue = Number(display.value);

      if (operator && waitingForNumber) {
        operator = nextOperator;
        return;
      }

      if (firstNumber === null) {
        firstNumber = inputValue;
      } else if (operator) {
        firstNumber = calculate(firstNumber, inputValue, operator);
        updateDisplay(String(firstNumber));
      }

      operator = nextOperator;
      waitingForNumber = true;
    }

    function calculate(first, second, selectedOperator) {
      switch (selectedOperator) {
        case "+": return first + second;
        case "−": return first - second;
        case "×": return first * second;
        case "÷": return second === 0 ? "Error" : first / second;
        default: return second;
      }
    }

    function clearCalculator() {
      firstNumber = null;
      operator = null;
      waitingForNumber = false;
      updateDisplay("0");
    }

    function backspace() {
      if (!waitingForNumber) {
        const shortened = display.value.slice(0, -1);
        updateDisplay(shortened || "0");
      }
    }

    function calculateResult() {
      if (operator === null || waitingForNumber) return;

      const result = calculate(firstNumber, Number(display.value), operator);
      updateDisplay(String(result));
      firstNumber = null;
      operator = null;
      waitingForNumber = true;
    }

    document.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.number) {
          inputNumber(button.dataset.number);
          return;
        }

        switch (button.dataset.action) {
          case "decimal": inputDecimal(); break;
          case "operator": chooseOperator(button.textContent); break;
          case "equals": calculateResult(); break;
          case "clear": clearCalculator(); break;
          case "backspace": backspace(); break;
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) inputNumber(event.key);
      if (event.key === ".") inputDecimal();
      if (event.key === "+") chooseOperator("+");
      if (event.key === "-") chooseOperator("−");
      if (event.key === "*") chooseOperator("×");
      if (event.key === "/") chooseOperator("÷");
      if (event.key === "Enter" || event.key === "=") calculateResult();
      if (event.key === "Escape") clearCalculator();
      if (event.key === "Backspace") backspace();
    });
  </script>
</body>
</html>
